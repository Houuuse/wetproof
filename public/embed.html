<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Wetproof Embed</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/style.css" />
    <style>
        :root {
            --accent: #007aff;
        }

        body {
            margin: 0;
            padding: 1rem;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: #fff;
            color: #111;
        }

        main {
            max-width: 420px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            color: var(--accent);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        input[type="file"] {
            padding: 0.4rem;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .card,
        .summary {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 1rem;
            margin-top: 1rem;
            background: #fff;
        }

        .ok {
            color: #1a7f1a;
        }

        .bad {
            color: #b10f2e;
        }

        .warn {
            color: #a06b00;
        }

        #previewCanvas {
            display: block;
            margin-top: 1rem;
            width: 100%;
            max-height: 260px;
            border: 1px solid #eee;
        }
    </style>

    <!-- pdf.js (UMD global) -->
    <script src="https://unpkg.com/pdfjs-dist@5.4.394/legacy/build/pdf.js"></script>
</head>

<body>
    <main>
        <h1>Wetproof Check</h1>
        <form id="uploadForm">
            <input type="file" id="pdfFile" name="file" accept="application/pdf" />
            <button id="checkBtn" type="submit">Run Check</button>
        </form>

        <div id="summary" class="summary" hidden>
            <p>Drop your file to start a check.</p>
        </div>

        <canvas id="previewCanvas"></canvas>
    </main>

    <script src="/embed.js"></script>
</body>

</html>
