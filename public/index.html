<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Wetproof — Report</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/style.css" />



</head>

<body>
    <main>
        <h1>Wetproof — PDF Check</h1>

        <form class="upload-form" id="uploadForm">
            <label for="pdfFile">Choose a PDF:</label>
            <input id="pdfFile" name="file" type="file" accept="application/pdf" required />

            <label for="preset">Preset size:</label>
            <select id="preset" name="preset"></select>

            <div class="grid">
                <div>
                    <label for="widthMm">Width (mm):</label>
                    <input id="widthMm" name="expectedWidthMm" type="number" step="0.1" />
                </div>
                <div>
                    <label for="heightMm">Height (mm):</label>
                    <input id="heightMm" name="expectedHeightMm" type="number" step="0.1" />
                </div>
            </div>

            <div class="grid">
                <div>
                    <label for="minBleedMm">Min bleed (mm):</label>
                    <input id="minBleedMm" name="minBleedMm" type="number" step="0.1" value="3" />
                </div>
                <div>
                    <label for="sizeToleranceMm">Size tolerance (mm):</label>
                    <input id="sizeToleranceMm" name="sizeToleranceMm" type="number" step="0.1" value="1.5" />
                </div>
            </div>
        
            <button id="submitBtn" type="submit">Upload & Inspect</button>
        </form>

        <section id="reportActions" class="actions" hidden>
            <button id="downloadHtmlBtn" type="button">Download report (.html)</button>
            <button id="printBtn" type="button">Print / Save as PDF</button>
            <button id="copySummaryBtn" type="button">Copy summary</button>
        </section>

        <section id="previewSection" hidden>
            <h2>Preview</h2>
            <canvas id="previewCanvas" class="preview-canvas"></canvas>
            <p class="hint">Preview shows page 1 only (for speed). Full preflight below.</p>
        </section>

        <section id="reportSection" hidden>
            <h2>Report</h2>
            <div id="summary" class="summary"></div>
            <div id="pageCards" class="cards"></div>

            <details class="raw-json">
                <summary>Raw JSON (debug)</summary>
                <pre id="out">—</pre>
            </details>
        </section>
    </main>

    <script src="/script.js"></script>
</body>

</html>
